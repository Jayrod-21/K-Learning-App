[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-service"
version = "0.1.0"
description = "Korean morphological analyzer service (Kiwi + FastAPI) for Korean Master"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Korean Master" }]

# Runtime deps are pinned to MAJOR.MINOR; tighten to MAJOR.MINOR.PATCH in lockfile.
# kiwipiepy is the Python binding to Kiwi (https://github.com/bab2min/kiwipiepy).
# It ships the model and the analyzer in one wheel; no separate model download.
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "structlog>=24.4,<25.0",
  "kiwipiepy>=0.20,<0.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
  "httpx>=0.27,<0.28",          # for FastAPI TestClient transport
  "ruff>=0.7,<0.8",
  "mypy>=1.13,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "W",       # pycodestyle + pyflakes
  "I",                 # isort
  "B",                 # bugbear
  "UP",                # pyupgrade
  "SIM",               # simplify
  "RUF",               # ruff-specific
  "ASYNC",             # async correctness
  "S",                 # bandit-lite
]
ignore = [
  "S101",  # asserts are fine in tests; we never use them as runtime checks
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
# kiwipiepy doesn't ship type stubs as of 0.20. Ignore missing imports only for it.
[[tool.mypy.overrides]]
module = ["kiwipiepy", "kiwipiepy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "slow: tests that load the Kiwi model (use --no-slow to skip)",
]
