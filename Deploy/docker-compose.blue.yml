# =============================================================================
# Korean Master — BLUE color trio (km-blue compose project)
# -----------------------------------------------------------------------------
# One of two interchangeable color stacks (see docker-compose.green.yml — this
# file's exact mirror with green/blue and 1843/1842 swapped). A "color" is the
# trio km-server-blue + km-client-blue + km-kiwi-blue. The load balancer
# (km-shared) decides which color is prod (1840) vs test (1841); bringing a color
# up does NOT make it live — only `nginx_switch` (Builder B) flips traffic.
#
# PREBUILT IMAGES, NOT build: — the Azure pipeline builds km-server / km-client /
# km-kiwi, `docker save`s them to tar artifacts, and the self-hosted agent
# `docker load`s them on the box. We reference them by tag only. BLUE_IMAGE_TAG
# pins the whole trio to ONE version per color (set by save_env_var on deploy).
#
# CROSS-PROJECT SHARING (see docker-compose.shared.yml header for the full rationale):
# km-internal / km-edge / km_images / km_book_uploads are declared `external: true` +
# name-pinned here, so this project ATTACHES to the objects km-shared (or
# ensure-shared-volume.sh) created rather than minting its own namespaced copies.
# Both colors mount the SAME km_images volume so user-uploaded OCR images survive a
# switch, and the SAME km_book_uploads volume so uploaded book PDFs (U1a) do too.
# =============================================================================

name: km-blue

services:

  # ---------------------------------------------------------------------------
  # km-kiwi-blue — Korean morphological analyzer. Internal-only, no creds, no
  # egress, read-only FS. Declared first so depends_on can gate the server on it.
  # ---------------------------------------------------------------------------
  km-kiwi-blue:
    image: km-kiwi:${BLUE_IMAGE_TAG:-latest}
    container_name: km-kiwi-blue
    restart: unless-stopped

    # Env mirrors the dev kiwi service (Repository/docker-compose.yml). No DB
    # creds, no API key — defense in depth: a hypothetical RCE here reaches nothing.
    environment:
      - KIWI_HOST=0.0.0.0
      - KIWI_PORT=8000
      - KIWI_MODEL_SIZE=${KIWI_MODEL_SIZE:-base}
      - KIWI_LOG_LEVEL=${KIWI_LOG_LEVEL:-INFO}
      - KIWI_MAX_INPUT_CHARS=${KIWI_MAX_INPUT_CHARS:-4096}
      - KIWI_SERVICE_NAME=kiwi-service

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health | grep -q '\"model_loaded\": *true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s

    networks:
      # Internal ONLY — no host port, reached as http://km-kiwi-blue:8000 by the
      # same-color server over km-internal. No egress (internal:true network).
      - km-internal

    read_only: true
    tmpfs:
      - /tmp:size=16m

    deploy:
      resources:
        limits:
          memory: ${KIWI_MEM_LIMIT:-512m}
          cpus: "${KIWI_CPU_LIMIT:-1.5}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # km-server-blue — Express API + Claude proxy. Straddles km-internal (DB + kiwi)
  # and km-edge (LB routes here; server egresses to the Anthropic API).
  # ---------------------------------------------------------------------------
  km-server-blue:
    # ${BLUE_IMAGE_TAG:-latest}: the pipeline ALWAYS sets a real, unique tag (the
    # CI Build.BuildId) via save_env_var BEFORE `compose_color up`, so `latest` is
    # never the intended runtime tag — it is only a last-ditch fallback if the .env
    # line is missing (C-SF4). There is no registry, so a stray `latest` would run a
    # leftover/absent image: a color running `latest` is a red flag. See README
    # "Reading and flipping the active color".
    image: km-server:${BLUE_IMAGE_TAG:-latest}
    container_name: km-server-blue
    restart: unless-stopped

    environment:
      - PORT=4000
      # Shared DB on km-internal — the host is the shared km-db, identical for
      # both colors (the switch is a pure nginx flip; no per-color DB).
      # B-030 (migration 047): the APP authenticates as the least-privileged
      # km_app role (DML only — no DDL/TRUNCATE/superuser), NOT the
      # POSTGRES_USER superuser. Only the migration runner (run_migrate in
      # deployment-utils.sh) and backup/psql tooling keep POSTGRES_USER.
      # ${KM_APP_PASSWORD:?…} makes ANY compose command fail loudly while the
      # .env still lacks the var — better than starting a server that cannot
      # authenticate. One-time password setup after 047 applies (and rotation):
      # Deploy/set-km-app-password.sh. See Deploy/.env.example.
      - DATABASE_URL=postgres://${KM_APP_USER:-km_app}:${KM_APP_PASSWORD:?KM_APP_PASSWORD not set in Deploy/.env - required since migration 047 (B-030), see Deploy/.env.example}@km-db:5432/${POSTGRES_DB}
      - PGAPPNAME=km-server-blue
      # Phase 1.3 story-runner gating (config/index.ts's `isRunnerActiveColor`):
      # this container's own color, hardcoded per compose file exactly like
      # PGAPPNAME/KIWI_URL above — it never changes for this container's
      # lifetime, unlike WHICH color is active (see ACTIVE_COLOR_FILE mount
      # below, which does change, without a restart, on every switch).
      - DEPLOY_COLOR=blue
      # Same-color kiwi — NOT cross-color. KIWI_URL is set here by compose, never
      # in the .env (the .env is color-agnostic; the URL is per-color).
      - KIWI_URL=http://km-kiwi-blue:8000
      # CLIENT_ORIGIN is the SINGLE public prod URL for BOTH colors (CORS +
      # SameSite=Strict require the real origin). Consequence (C-SF2): browsing the
      # inactive color on the LB test port :1841 cannot exercise authenticated flows
      # — credentialed XHR from a :1841 origin is correctly rejected by CORS, and
      # Strict cookies aren't sent cross-port. That is BY DESIGN: :1841 is for
      # automated + unauthenticated health/smoke checks; full authenticated
      # validation happens post-switch on :1840 (the auto-rollback is the safety net).
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # F-210 story TTS (ElevenLabs). OPTIONAL — the feature ships DORMANT:
      # while the key is blank in Deploy/.env the server boots normally, the
      # audio endpoints report ttsConfigured=false, and enqueues 503. Going
      # live is a Deploy/.env edit + redeploy; no code or compose change.
      # `${VAR:-}` (empty when unset) so compose never errors on the missing
      # var; the config schema reads empty as unset.
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      # F-211 story illustrations (OpenAI gpt-image-1). OPTIONAL — the same
      # dormant-ship posture as ELEVENLABS_API_KEY above: blank in Deploy/.env
      # means the server boots normally, the image endpoints report
      # imageGenConfigured=false, and enqueues 503. Going live is a
      # Deploy/.env edit + redeploy; no code or compose change.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TOTP_SECRET_ENC_KEY=${TOTP_SECRET_ENC_KEY}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-false}
      - MFA_REQUIRED=${MFA_REQUIRED:-true}
      # Phase 1.3 operator kill switch for the story-TTS/illustration runners
      # (config/index.ts's STORY_RUNNERS_ENABLED) — layered UNDER the
      # automatic DEPLOY_COLOR/ACTIVE_COLOR_FILE gate below; default true so
      # this flag changes nothing unless an operator deliberately sets it.
      - STORY_RUNNERS_ENABLED=${STORY_RUNNERS_ENABLED:-true}
      # In-container path the mounted active-color file is read from (see the
      # matching volumes: entry below). Fixed — both colors use the same
      # in-container path; only the HOST file differs per the ACTIVE_COLOR_FILE
      # bash var in deployment-utils.sh (KM_ACTIVE_COLOR_FILE override).
      - ACTIVE_COLOR_FILE=/app/deploy/active-color
      # F-006 email verification (values in Deploy/.env). SMTP_HOST unset ⇒
      # mock transport (no real send). host.docker.internal reaches Proton
      # Mail Bridge on the HOST (see extra_hosts below).
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-true}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_TLS_REJECT_UNAUTHORIZED=${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - IMAGE_STORAGE_DIR=${IMAGE_STORAGE_DIR:-/app/var/images}
      - BOOK_UPLOAD_STORAGE_DIR=${BOOK_UPLOAD_STORAGE_DIR:-/app/var/book-uploads}
      # Track A (A-3): where the server WRITES uploaded audio blobs. Matches
      # the km_audio_uploads mount below; the km-worker (shared stack) mounts
      # the SAME volume read-only at its own path (audio_tracks.blob_ref is
      # relative, so per-container roots may differ).
      - AUDIO_UPLOAD_STORAGE_DIR=${AUDIO_UPLOAD_STORAGE_DIR:-/app/var/audio-uploads}
      # F-012: where the server reads corpus mp3s (routes/ttmik.ts). Matches
      # the read-only bind mount below — fixed in-container path, both colors.
      - CORPUS_AUDIO_DIR=/corpus
      # F-120: where the server reads TOPIK question-figure crops
      # (routes/topik.ts GET /topik/image). Same read-only corpus mount as the
      # audio root — a distinct variable so the roots can split later.
      - CORPUS_IMAGE_DIR=/corpus

    # F-006: reach Proton Mail Bridge on the HOST. Bridge's SMTP listens on the
    # host's 127.0.0.1, unreachable from inside the container; host-gateway maps
    # host.docker.internal → the host. Only used when SMTP_HOST is set to it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # SHARED image volume — BOTH colors mount km_images at the same path so
      # user-uploaded OCR images persist across a color switch.
      - km_images:${IMAGE_STORAGE_DIR:-/app/var/images}
      # SHARED book-upload volume — BOTH colors mount km_book_uploads at the same
      # path so user-uploaded book PDFs (U1a) persist across a color switch.
      - km_book_uploads:${BOOK_UPLOAD_STORAGE_DIR:-/app/var/book-uploads}
      # SHARED audio-upload volume (Track A, A-3) — BOTH colors mount
      # km_audio_uploads at the same path so uploaded audio survives a color
      # switch. Read-WRITE: the server is the SOLE writer (POST /audio); the
      # km-worker Whisper container mounts this same volume :ro (see
      # docker-compose.shared.yml).
      - km_audio_uploads:${AUDIO_UPLOAD_STORAGE_DIR:-/app/var/audio-uploads}
      # F-012: corpus audio tree (TTMIK/Iyagi mp3s), READ-ONLY — the server
      # only ever streams from it; a compromised server cannot alter the
      # corpus. Set CORPUS_AUDIO_DIR_HOST in the .env to the host directory
      # CONTAINING the TTMIK/ tree (e.g. ~/data/korean-master/corpus, spelled
      # absolute). If unset, the default is bind-mounted (Docker creates it
      # empty when missing) and audio endpoints simply 404 — a missing corpus
      # never blocks a deploy.
      - ${CORPUS_AUDIO_DIR_HOST:-/srv/korean-master/corpus}:/corpus:ro
      # Phase 1.3: the active-color signal (a single line naming "blue" or
      # "green"), READ-ONLY — a compromised server cannot promote itself.
      # BOTH colors mount this SAME host file so a switch (which rewrites it
      # via write_active_color_file) is visible to both without a restart.
      # NOT the secrets-bearing .env — this file holds nothing but a color
      # name. KM_ACTIVE_COLOR_FILE overrides the host path (mirrors
      # KM_LIVE_NGINX_CONF); default is Deploy/active-color, seeded by
      # local-standup.sh before either color's compose first comes up.
      - ${KM_ACTIVE_COLOR_FILE:-./active-color}:/app/deploy/active-color:ro

    ports:
      # Direct debug port, LOOPBACK ONLY (operator curls the color in isolation,
      # bypassing the LB). Public traffic only ever reaches the LB.
      - "127.0.0.1:${BLUE_PORT:-1842}:4000"

    depends_on:
      km-kiwi-blue:
        condition: service_healthy

    # Readiness signal the orchestrator polls — deployment-utils.sh wait_healthy
    # km-server-blue gates the deploy on this (C-SF1). GET /health is unauthenticated
    # and returns 200/503 (server/src/routes/health.ts). Uses node (guaranteed in the
    # node:22-alpine runtime) rather than assuming a wget/curl binary. start_period is
    # generous: the server waits on km-db + km-kiwi at boot.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

    # NOTE: km-server is intentionally NOT read_only (C-SF5). The Node process
    # writes user-uploaded OCR images to the km_images volume mount; the rest of
    # its writes (tmp, logs) are not volume-backed, so a read_only root would need
    # a tmpfs audit we defer. The client (pure static nginx) IS read_only below.
    networks:
      - km-internal
      - km-edge

    deploy:
      resources:
        limits:
          memory: ${SERVER_MEM_LIMIT:-1g}
          cpus: "${SERVER_CPU_LIMIT:-2.0}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # km-client-blue — prod static-nginx SPA image (client/Dockerfile.prod). Serves
  # the built bundle + /healthz; the API split is done one layer up at the LB. NO
  # host port — reached as http://km-client-blue:80 by the LB over km-edge.
  # ---------------------------------------------------------------------------
  km-client-blue:
    image: km-client:${BLUE_IMAGE_TAG:-latest}
    container_name: km-client-blue
    restart: unless-stopped

    healthcheck:
      # 127.0.0.1, NOT localhost: nginx `listen 80` binds IPv4 only, but inside
      # the container `localhost` resolves to ::1 (IPv6) first, so busybox wget
      # gets connection-refused and the container never goes healthy. -q/--spider
      # are the only busybox-supported forms (no --quiet/--tries in BusyBox wget).
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    # Least-privilege parity with km-kiwi (C-SF5): a pure static-nginx image needs
    # no writable root — only the two paths nginx writes at runtime, as tmpfs.
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m

    networks:
      - km-edge

    deploy:
      resources:
        limits:
          memory: ${CLIENT_MEM_LIMIT:-128m}
          cpus: "${CLIENT_CPU_LIMIT:-1.0}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

# -----------------------------------------------------------------------------
# External (name-pinned) networks + volume — created by km-shared /
# ensure-shared-volume.sh; this color project only ATTACHES. `external: true`
# means compose will NOT create them and will error if they are missing — run
# ensure-shared-volume.sh (or `compose_shared up`) first. See shared.yml header.
# -----------------------------------------------------------------------------
networks:
  km-internal:
    external: true
    name: km-internal
  km-edge:
    external: true
    name: km-edge

volumes:
  km_images:
    external: true
    name: km_images
  km_book_uploads:
    external: true
    name: km_book_uploads
  km_audio_uploads:
    external: true
    name: km_audio_uploads
