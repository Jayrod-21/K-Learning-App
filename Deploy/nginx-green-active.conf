# =============================================================================
# Korean Master — Load Balancer (GREEN ACTIVE)
# -----------------------------------------------------------------------------
# Blue-green deployment. In THIS file green is the live (prod) color and blue is
# the staged (test) color:
#
#   prod  (listen 1840) -> GREEN  containers
#   test  (listen 1841) -> BLUE   containers
#
# WHY DYNAMIC (resolver + variable proxy_pass), NOT static `upstream` blocks:
# A hard-coded `upstream { server km-server-blue:4000; }` makes nginx resolve
# that hostname AT STARTUP and refuse to boot if it is missing
# (`[emerg] host not found in upstream`). In blue-green the INACTIVE color is
# down by definition (and on the very first deploy BOTH the test color and the
# fresh active color may not be up yet when km-lb starts), so static upstreams
# crash the LB. Instead we set a Docker-DNS `resolver` and put each backend in a
# VARIABLE: nginx then resolves it LAZILY, per request, at request time. The LB
# always starts; a request to a color that is down returns a clean 502 (which the
# deploy health checks treat as "not ready yet"), never a startup crash.
#
# SAME-ORIGIN SPLIT ROUTING (locked posture — client/SECURITY.md §1/§2, ADR-002):
# The SPA is built with VITE_API_URL UNSET, so its API base is the empty string
# and it calls /auth, /vocab, /health, ... on the SAME hostname it is served
# from. There is NO /api prefix and NO trailing-slash strip. The load balancer
# splits a single origin by path:
#   * paths under a known SERVER route prefix  -> the color's API container
#   * everything else (SPA shell, hashed assets, service worker, manifest, ...)
#     -> the color's CLIENT container (its own nginx serves static + SPA fallback)
#
# `proxy_pass http://$backend$request_uri;` forwards the ORIGINAL request URI
# (path + query) unchanged — the API receives /vocab/123?x=1, not /123. (With a
# variable in proxy_pass nginx does NOT auto-append the URI, so we append
# $request_uri explicitly; this was verified to preserve path + query string.)
# =============================================================================

# This file is the COMPLETE nginx.conf that km-lb mounts at /etc/nginx/nginx.conf
# (docker-compose.shared.yml), so it carries the mandatory top-level `events {}`
# and wraps the routing in `http {}`. (An http-context fragment without these
# wrappers fails to load as a standalone config: `"upstream"/"server" directive
# is not allowed here`.)
events {}

http {
    # Stock mime types + sane defaults from the base image.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Docker's embedded DNS (user-defined networks). valid= keeps resolution
    # fresh as colors come and go; ipv6=off because the compose networks are
    # IPv4-only here.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket / SSE upgrade plumbing.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

# Terminated TLS lives in front of this LB (Cloudflare tunnel); the per-location
# proxy headers below advertise https/443 downstream so the API builds correct
# absolute URLs + secure-cookie logic behaves.

# =============================================================================
# PROD server — listen 1840 -> ACTIVE color (GREEN)
# =============================================================================
server {
    listen 1840;
    server_name _;

    # LB's own liveness probe (answered locally, never proxied). Exact-match so it
    # is checked before the regex API location and never captured as a route.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # API routes -> active color's server. Backend in a variable so nginx resolves
    # km-server-green lazily (LB starts even if the color is momentarily down).
    location ~ ^/(admin|auth|health|define|enrich|lemmatize|krdict|conversation|progress|vocab|grammar-drill|grammar|diagnostic|topik|hanja|images|plan|settings|grade-writing|writing|ttmik|iyagi|audio|uploads|reading|tickets|notifications|ability)(/|$) {
        # Book/image uploads (multipart) are large: the app caps a book upload at
        # ~300 MB (a vFlat page-image zip is ~240 MB; a scanned PDF is tens of MB).
        # Without this, nginx's 1 MB default 413s the upload BEFORE it reaches the
        # server, so no route ever sees it. The app-layer multer fileSize cap + the
        # per-user daily cap remain the real size enforcement; this only lifts the
        # proxy's floor above them so a legitimate book upload isn't cut off early.
        client_max_body_size 320m;
        # Browser navigations (Accept: text/html) to a path that collides with an
        # API prefix (/progress, /settings, /diagnostic, ...) get the SPA shell,
        # NOT the JSON API — else a refresh/bookmark/deep-link 401s. XHR/fetch/SSE
        # (application/json, */*, text/event-stream) have no text/html and fall
        # through to the server, so real API traffic is unaffected.
        set $km_backend "km-server-green:4000";
        if ($http_accept ~* "text/html") {
            set $km_backend "km-client-green:80";
        }
        proxy_pass http://$km_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SSE / streaming friendly (/conversation + Claude-backed routes).
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
    }

    # Everything else -> active color's client (static SPA + its own fallback).
    location / {
        set $client_backend "km-client-green:80";
        proxy_pass http://$client_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# =============================================================================
# TEST server — listen 1841 -> INACTIVE color (BLUE)
# =============================================================================
server {
    listen 1841;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location ~ ^/(admin|auth|health|define|enrich|lemmatize|krdict|conversation|progress|vocab|grammar-drill|grammar|diagnostic|topik|hanja|images|plan|settings|grade-writing|writing|ttmik|iyagi|audio|uploads|reading|tickets|notifications|ability)(/|$) {
        # Book/image uploads (multipart) are large: the app caps a book upload at
        # ~300 MB (a vFlat page-image zip is ~240 MB; a scanned PDF is tens of MB).
        # Without this, nginx's 1 MB default 413s the upload BEFORE it reaches the
        # server, so no route ever sees it. The app-layer multer fileSize cap + the
        # per-user daily cap remain the real size enforcement; this only lifts the
        # proxy's floor above them so a legitimate book upload isn't cut off early.
        client_max_body_size 320m;
        set $km_backend "km-server-blue:4000";
        if ($http_accept ~* "text/html") {
            set $km_backend "km-client-blue:80";
        }
        proxy_pass http://$km_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
    }

    location / {
        set $client_backend "km-client-blue:80";
        proxy_pass http://$client_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
}
