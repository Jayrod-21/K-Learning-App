# =============================================================================
# Korean Master — Client image nginx (per-color SPA static server)
# -----------------------------------------------------------------------------
# This nginx ships INSIDE the client container (km-client-blue / km-client-green)
# and serves ONLY the built SPA: static assets, the SPA history fallback, and a
# local /healthz. It does NOT proxy the API.
#
# Same-origin posture (client/SECURITY.md §1/§2, ADR-002): the API split happens
# one layer up at the load balancer, which sends API paths to the server and
# everything else here. The SPA is built with VITE_API_URL UNSET (empty base),
# so it issues relative requests that the LB routes by path. Because this server
# never sees API paths, no proxy block is needed or wanted here.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version.
    server_tokens off;

    # Compression (N-4): compress text assets on the wire. Hashed /assets/ are
    # cached immutable, so this mainly helps first load + index.html/JS/CSS. Never
    # gzip already-compressed types (images/fonts). Cloudflare also compresses at the
    # edge; this covers the direct-origin + :1841 test path too.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/manifest+json
        application/wasm image/svg+xml;

    # Container liveness probe (used by the LB upstream health / orchestrator).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # --- Service worker: never cache --------------------------------------
    # The SW controls update rollout; a stale cached SW would pin users to an
    # old build. Always revalidate.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        expires    off;
        try_files  $uri =404;
    }

    # --- Web app manifest: never cache ------------------------------------
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        expires    off;
        try_files  $uri =404;
    }

    # --- Hashed build assets: immutable, long-lived cache -----------------
    # Vite emits content-hashed filenames under /assets, so they can be cached
    # aggressively and forever — a new build produces new filenames.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files  $uri =404;
    }

    # --- SPA history fallback ---------------------------------------------
    # Any unknown path resolves to index.html so client-side routing works.
    # index.html itself must NOT be cached so new deploys are picked up.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        expires    off;
    }
}
