# =============================================================================
# Korean Master — SHARED stack (km-shared compose project)
# -----------------------------------------------------------------------------
# Blue/green is run as THREE separate compose projects on one host:
#   * km-shared  (this file)  — the load balancer, the ONE shared Postgres, and
#                               the nightly backup sidecar. Long-lived; survives
#                               every color switch.
#   * km-blue    (docker-compose.blue.yml)  — the blue color trio.
#   * km-green   (docker-compose.green.yml) — the green color trio.
#
# WHY a shared stack: the switch is a pure nginx flip (prod port 1840 → the new
# color). Both colors point at the SAME Postgres and the SAME image volume, so a
# switch copies no data and user uploads survive. The DB therefore CANNOT live in
# a per-color project — it lives here and outlives any single color.
#
# CROSS-PROJECT SHARING DECISION (the crux — read before editing any compose file)
# ---------------------------------------------------------------------------------
# The three compose projects must reference the SAME docker network + volume
# objects. Compose normally namespaces these by project (`<project>_<name>`), which
# would give km-blue a DIFFERENT `km-internal` than km-shared and the colors could
# never reach km-db. We defeat that namespacing with NAME-PINNED objects:
#   * every network/volume here declares an explicit top-level `name:` (e.g.
#     `name: km-internal`), so the real docker object is `km-internal`, not
#     `km-shared_km-internal`.
#   * blue/green declare the same objects as `external: true` with the same `name:`,
#     i.e. "do NOT create these, attach to the pre-existing pinned object".
# This file (or ensure-shared-volume.sh, run first) is the single creator of those
# objects; blue/green only attach. ensure-shared-volume.sh idempotently creates the
# volumes AND the two networks so a color can be brought up even before km-shared,
# and so `external: true` never errors on a cold box. Keep all four files in sync:
# this file, docker-compose.blue.yml, docker-compose.green.yml, ensure-shared-volume.sh.
# =============================================================================

name: km-shared

services:

  # ---------------------------------------------------------------------------
  # km-lb — nginx load balancer. The ONLY public ingress (Cloudflare Tunnel sits
  # in front of it). Routes prod:1840 → active color, test:1841 → inactive color.
  # ---------------------------------------------------------------------------
  km-lb:
    image: nginx:1.27-alpine
    container_name: km-lb
    restart: unless-stopped

    # Host bindings. Cloudflare Tunnel terminates TLS and forwards to these.
    # 1840 = prod (active color), 1841 = test (inactive color, validate before flip).
    ports:
      - "1840:1840"
      - "1841:1841"

    volumes:
      # The LIVE config the LB serves. `update_nginx_config <color>` copies
      # nginx-<color>-active.conf onto this file and reloads — it decides which
      # color is prod. Mounted from a STABLE host path (KM_LIVE_NGINX_CONF),
      # NOT the pipeline checkout: the checkout is wiped every run, and a missing
      # bind-mount source makes Docker create the path as a DIRECTORY (which then
      # breaks the file mount). KM_LIVE_NGINX_CONF defaults to ./nginx.conf for
      # local/dev use; the deploy sets it to a persistent path next to the .env.
      - ${KM_LIVE_NGINX_CONF:-./nginx.conf}:/etc/nginx/nginx.conf:ro
      # Both color templates (these ARE in git), read-only, for reference/debugging
      # inside the box and so an operator can diff the live conf against intent.
      - ./nginx-blue-active.conf:/etc/nginx/nginx-blue-active.conf:ro
      - ./nginx-green-active.conf:/etc/nginx/nginx-green-active.conf:ro

    healthcheck:
      # The LB's OWN liveness endpoint (location = /healthz returns a static 200),
      # NOT a proxied color /health — the LB must report healthy even when a color
      # is mid-deploy or down. nginx:alpine ships curl is NOT guaranteed; use the
      # bundled (busybox) wget instead to avoid a missing-binary false negative.
      # 127.0.0.1, NOT localhost: nginx listens IPv4-only, but `localhost`
      # resolves to ::1 (IPv6) first -> busybox wget connection-refused -> the LB
      # reports unhealthy forever. -q/--spider are the only busybox-supported
      # forms (no --quiet/--tries in BusyBox wget).
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:1840/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

    networks:
      # km-edge: the LB talks to km-client-* and km-server-* here; it has no
      # business on the internal DB network.
      - km-edge
      # services_default: the shared bridge where the Cloudflare tunnel
      # (cloudflared) runs. km-lb joins it so the tunnel can resolve and reach
      # this container as `km-lb:1840`. ONLY the LB joins it — the client/server/
      # kiwi/db stay off it so the tunnel's only path in is through the LB.
      # NOTE: this is an external network owned by the cloudflared compose
      # project; that stack must be up (so the network exists) before km-shared
      # starts, or `external: true` resolution will fail.
      - services_default

    deploy:
      resources:
        limits:
          memory: ${LB_MEM_LIMIT:-256m}
          cpus: "${LB_CPU_LIMIT:-1.0}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # km-db — the ONE shared Postgres both colors point at. Mirrors the dev compose
  # (Repository/docker-compose.yml) hardening verbatim so prod ≡ dev DB posture.
  # See db/README.md, db/SECURITY.md.
  # ---------------------------------------------------------------------------
  km-db:
    image: postgres:16-alpine
    container_name: km-db
    restart: unless-stopped

    # Loopback ONLY — host-side access goes through 127.0.0.1 (migrate.py, psql,
    # pg_dump from the host). The tunnel never reaches the DB. `internal: true` on
    # km-internal blocks container egress; this port binding is a separate
    # kernel-level construct and is intentionally loopback-scoped.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGAPPNAME: km-db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"

    # Identical role-level flags to dev: bound runaway queries / abandoned txs and
    # turn on the diagnostic logging the backup/restore tooling relies on. NB:
    # migrate.py SETs statement_timeout=0 + idle_in_transaction_session_timeout=0
    # on its own connection so expand-style migrations (CREATE INDEX, backfills)
    # are not killed by the 30s role cap.
    command:
      - "postgres"
      - "-c"
      - "statement_timeout=30000"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_lock_waits=on"

    volumes:
      - km_db_data:/var/lib/postgresql/data
      # Shared backup target — a BIND mount of the host BACKUP_DIR, NOT a named
      # volume. db-backup.sh runs pg_dump in this container but redirects stdout to
      # the HOST path ($BACKUP_DIR/km-*.dump), and db-restore.sh path-translates a
      # host dump to /backups so pg_restore can open it as a seekable file. For
      # that host<->container translation to address the SAME bytes, /backups must
      # BE the host BACKUP_DIR. (A named volume is a separate filesystem, which is
      # what caused dumps to land nowhere reachable.)
      - ${BACKUP_DIR:-./backups}:/backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    networks:
      # Internal ONLY (no egress) — matches the dev posture. Defends against a
      # malicious dump's COPY FROM PROGRAM 'curl …' exfiltration (db/SECURITY.md T6).
      - km-internal

    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-2g}
          cpus: "${DB_CPU_LIMIT:-2.0}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # km-backup — nightly pg_dump sidecar (Builder C owns km-backup-entrypoint.sh).
  # Same image as km-db so pg_dump matches the server version exactly. Loops:
  # sleep until $BACKUP_TIME in $BACKUP_TZ, dump the shared DB, prune by retention.
  # NO host port. Internal-only (it only needs the DB + the backups volume).
  # ---------------------------------------------------------------------------
  km-backup:
    image: postgres:16-alpine
    container_name: km-backup
    restart: unless-stopped

    # Entrypoint script is authored by Builder C and mounted from this Deploy/ dir.
    # Referenced by path only here — we do not author it. /bin/bash is present in
    # postgres:16-alpine (it bundles bash), so the bash shebang/loop is safe.
    entrypoint: ["/bin/bash", "/opt/km/km-backup-entrypoint.sh"]

    volumes:
      # Mount the Deploy/ dir read-only so the container can run the entrypoint
      # script (and reach db-backup.sh, which it calls). Read-only: the backup
      # loop must never mutate deploy source.
      - ./:/opt/km:ro
      # Same host BACKUP_DIR bind as km-db (see km-db above) so dumps land in one
      # place reachable by the host scripts, km-db, and this sidecar alike. In
      # production BACKUP_DIR (in the server .env) is the host's NFS mount point
      # for the NAS share, so dumps written to /backups are stored on the NAS.
      # The host must have that NFS export mounted (fstab) BEFORE the stack comes
      # up, or this bind maps the empty local underlay (BACKUP_REQUIRE_MOUNT in
      # the host pre-deploy backup guards against that case).
      - ${BACKUP_DIR:-./backups}:/backups

    environment:
      # PG* creds for pg_dump come from the server .env (passed by compose via the
      # --env-file the orchestrator supplies). NEVER echoed by the entrypoint.
      PGHOST: km-db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # Dump over the network from inside this postgres image — no Docker socket,
      # no docker CLI, no .env file. (Mounting the Docker socket into a backup
      # container would be host-root-equivalent — deliberately avoided.) See
      # db-backup.sh BACKUP_DB_ACCESS.
      BACKUP_DB_ACCESS: direct
      # Where dumps land INSIDE the container: always /backups, the bind-mount
      # target below — NOT the host ${BACKUP_DIR} (that host path, e.g. the NFS
      # mount, does not exist by that name in here). The bind maps the host NAS
      # directory -> /backups, so dumps written here land on the NAS.
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_TZ: ${BACKUP_TZ:-America/Chicago}
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}

    depends_on:
      km-db:
        condition: service_healthy

    networks:
      - km-internal

    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEM_LIMIT:-256m}
          cpus: "${BACKUP_CPU_LIMIT:-1.0}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # km-worker — Track A GPU Whisper transcription worker (tools/audio_stt).
  # Drains the audio_transcription_jobs queue on km-db and transcribes with
  # faster-whisper on the host NVIDIA GPU (RTX 3070).
  #
  # WHY it lives in the SHARED project, not per-color: the DB queue
  # (claim/settle/reap, 076) makes the worker color-agnostic — it serves
  # whichever color enqueued the job — and the ONE GPU cannot be time-shared by
  # two concurrent Whisper processes, so a per-color pair would fight over it.
  # Single long-lived instance, same placement rationale as km-backup.
  #
  # IMAGE: built ON THIS HOST (Deploy/worker.Dockerfile via `build_worker` in
  # deployment-utils.sh), NOT CI-built/tar-shipped like the color images — the
  # CUDA + baked-large-v3 image is multi-GB and targets this host's GPU. Hence
  # its own WORKER_IMAGE_TAG (normally `latest`), decoupled from the per-color
  # release tags.
  # ---------------------------------------------------------------------------
  km-worker:
    image: km-worker:${WORKER_IMAGE_TAG:-latest}
    container_name: km-worker
    restart: unless-stopped

    environment:
      # Least-privilege km_app role — the SAME principal as km-server-<color>
      # (B-030, migration 047; DML only). The worker's whole DB surface
      # (SELECT/UPDATE audio_transcription_jobs + audio_tracks, INSERT/DELETE
      # audio_transcript_segments) is covered by 047's blanket + default-
      # privilege grants.
      # NB `:-` here, NOT the color files' `${KM_APP_PASSWORD:?…}` hard-fail:
      # the SHARED stack must come up on a cold box BEFORE 047 has applied and
      # set-km-app-password.sh has run (km-db must start so run_migrate can
      # create km_app in the first place). While the password is missing the
      # worker merely crash-loops on auth — noisy, but it never blocks the
      # km-db/km-lb bootstrap that the `:?` form would.
      DATABASE_URL: postgres://${KM_APP_USER:-km_app}:${KM_APP_PASSWORD:-}@km-db:5432/${POSTGRES_DB}
      # Fixed in-container blob root — must match the km_audio_uploads mount
      # below (074's contract: audio_tracks.blob_ref paths resolve under it).
      AUDIO_UPLOAD_STORAGE_DIR: /var/audio-uploads
      AUDIO_STALE_RUN_MINUTES: ${AUDIO_STALE_RUN_MINUTES:-60}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      # auto → cuda when the GPU reservation below is honored, cpu fallback.
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      # auto → float16 on cuda, int8 on cpu.
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-auto}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-5}

    volumes:
      # SHARED audio-blob volume, READ-ONLY: the worker only ever READS blobs
      # (transcription input); the server-side upload path (A-3) is the sole
      # writer. ro so a compromised worker cannot alter or delete audio.
      - km_audio_uploads:/var/audio-uploads:ro
      # NOTE: no model-cache volume — the large-v3 weights are BAKED into the
      # image (worker.Dockerfile HF_HOME layer) because km-internal has no
      # egress to download them at runtime.

    depends_on:
      km-db:
        condition: service_healthy

    networks:
      # Internal ONLY — the worker needs exactly km-db + the blob volume; no
      # ports, no egress (matches the km-db/km-backup posture).
      - km-internal

    deploy:
      resources:
        # GPU passthrough via the host nvidia container runtime
        # (nvidia-container-toolkit; wired on M). Modern device-reservation
        # form — compose maps it to `--gpus`-equivalent device requests.
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          # large-v3 float16 needs several GB of host RAM around the CUDA
          # allocations; 12g default leaves headroom without letting a leak
          # take the box down.
          memory: ${WORKER_MEM_LIMIT:-12g}
          cpus: "${WORKER_CPU_LIMIT:-4.0}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

# -----------------------------------------------------------------------------
# Networks — ALL THREE compose projects (km-shared / km-blue / km-green) treat
# these as EXTERNAL. ensure-shared-volume.sh is the SINGLE creator (it runs first
# in every deploy + on a cold box), creating km-internal with --internal and
# km-edge as a plain bridge. Declaring them `external: true` here (rather than as
# a second inline creator) avoids the "network exists but was not created by
# compose / incorrect label" conflict that arises when two creators race.
#   km-internal: bridge + --internal → no egress. km-db, km-server-*, km-kiwi-*.
#   km-edge:     bridge → LB ↔ client/server; server egress to the Claude API.
# -----------------------------------------------------------------------------
networks:
  km-internal:
    external: true
    name: km-internal
  km-edge:
    external: true
    name: km-edge
  # The Cloudflare tunnel's bridge network (owned by the cloudflared/services
  # compose project). Declared external so km-lb can attach to it for tunnel
  # ingress; the cloudflared stack is its single creator. If your tunnel's
  # network is named differently, change `name:` to match `docker network ls`.
  services_default:
    external: true
    name: services_default

# -----------------------------------------------------------------------------
# Volumes — EXTERNAL in all three projects; ensure-shared-volume.sh is the single
# creator (same single-creator rationale as the networks above). Name-pinned so
# the real docker objects are km_db_data / km_images / km_book_uploads (not
# km-shared_km_db_data) and every project attaches to the same ones. NOTE: backups
# are NOT a named volume — they use a host BIND mount (${BACKUP_DIR}) so the host
# backup/restore scripts and the containers address the same files (see the km-db
# volumes).
# -----------------------------------------------------------------------------
volumes:
  km_db_data:
    external: true
    name: km_db_data
  km_images:
    external: true
    name: km_images
  km_book_uploads:
    external: true
    name: km_book_uploads
  km_audio_uploads:
    external: true
    name: km_audio_uploads
