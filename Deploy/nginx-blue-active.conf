# =============================================================================
# Korean Master — Load Balancer (BLUE ACTIVE)
# -----------------------------------------------------------------------------
# Blue-green deployment. In THIS file blue is the live (prod) color and green is
# the staged (test) color:
#
#   prod  (listen 1840) -> BLUE   containers
#   test  (listen 1841) -> GREEN  containers
#
# SAME-ORIGIN SPLIT ROUTING (locked posture — client/SECURITY.md §1/§2, ADR-002):
# The SPA is built with VITE_API_URL UNSET, so its API base is the empty string
# and it calls /auth, /vocab, /health, ... on the SAME hostname it is served
# from. There is NO /api prefix and NO trailing-slash strip. The load balancer
# splits a single origin by path:
#
#   * paths under a known SERVER route prefix  -> the color's API container
#   * everything else (SPA shell, hashed assets, service worker, manifest, ...)
#     -> the color's CLIENT container (its own nginx serves static + SPA fallback)
#
# proxy_pass uses a bare upstream (no trailing URI) so the request path is
# preserved verbatim — the API receives /vocab/123, not /123.
# =============================================================================

# --- Upstreams ---------------------------------------------------------------
# Bare host:port only (no trailing path) so `proxy_pass http://name;` forwards
# the original request URI unchanged.

# PROD (active) -> BLUE
upstream km_prod_client {
    server km-client-blue:80;
}
upstream km_prod_api {
    server km-server-blue:4000;
}

# TEST (inactive) -> GREEN
upstream km_test_client {
    server km-client-green:80;
}
upstream km_test_api {
    server km-server-green:4000;
}

# --- Shared proxy header policy ----------------------------------------------
# Terminated TLS lives in front of this LB; advertise https/443 downstream so
# the API builds correct absolute URLs and secure-cookie logic behaves.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# =============================================================================
# PROD server — listen 1840 -> ACTIVE color (BLUE)
# =============================================================================
server {
    listen 1840;
    server_name _;

    # LB's own liveness probe (answered locally, never proxied). Must precede
    # the regex location so it is not captured as an API route.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # API routes -> active color's server (exact prefix list from server/src/app.ts
    # — keep in sync). This is ONE regex location; alternation order within it does
    # NOT affect matching, because every alternative is anchored by the trailing
    # (/|$): "/grammar-drill" can only match the `grammar-drill` alternative (the
    # `grammar` alternative would require "/grammar" then "/" or end-of-string, and
    # here a "-" follows). nginx picks the FIRST regex `location` in file order that
    # matches; the exact `location = /healthz` above is checked before any regex.
    # Path is preserved (bare upstream, no trailing slash on proxy_pass).
    location ~ ^/(auth|health|define|enrich|lemmatize|conversation|reading|progress|vocab|grammar-drill|grammar|diagnostic|topik|hanja|images|plan|settings|grade-writing)(/|$) {
        proxy_pass http://km_prod_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SSE / streaming friendly (/conversation + Claude-backed routes).
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Everything else -> active color's client (static SPA + its own fallback).
    location / {
        proxy_pass http://km_prod_client;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# =============================================================================
# TEST server — listen 1841 -> INACTIVE color (GREEN)
# =============================================================================
server {
    listen 1841;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location ~ ^/(auth|health|define|enrich|lemmatize|conversation|reading|progress|vocab|grammar-drill|grammar|diagnostic|topik|hanja|images|plan|settings|grade-writing)(/|$) {
        proxy_pass http://km_test_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://km_test_client;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
