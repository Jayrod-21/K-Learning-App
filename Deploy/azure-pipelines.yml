# =============================================================================
# Korean Master — Azure DevOps pipeline (build -> deploy-to-inactive -> switch)
# =============================================================================
# RELATIONSHIP TO GITHUB ACTIONS:
#   .github/workflows/ci.yml owns PR CI (lint/typecheck/test/build/audit on every
#   pull request). THIS pipeline owns build -> deploy on pushes to main. They are
#   complementary, not redundant: GH gates merges; Azure ships what merged.
#
# ARCHITECTURE (see Deploy/README.md):
#   * Blue/green on ONE host. ONE shared Postgres (km-db) both colors point to.
#   * Image delivery is by TAR ARTIFACT — we `docker build` + `docker save` on a
#     hosted agent and the self-hosted agent on dad's server `docker load`s them.
#     There is NO external registry (smaller attack surface, no registry creds).
#   * Three images per release, all tagged $(deployTag):
#       km-server  <- server/Dockerfile
#       km-client  <- client/Dockerfile.prod  (static nginx, same-origin build)
#       km-kiwi    <- services/kiwi/Dockerfile
#
# PATHS: this repo's checkout root contains Deploy/, server/, client/,
#   services/, db/, .github/ as siblings. Steps that build a lane set
#   workingDirectory to that lane; steps that run a deploy script invoke it as
#   Deploy/<script>.sh from the checkout root (the scripts cd to their own dir).
#
# SECRETS (D2 hybrid — see SECURITY.md):
#   POSTGRES_PASSWORD / ANTHROPIC_API_KEY / TOTP_SECRET_ENC_KEY are stored as
#   SECRET pipeline variables (set in the Azure UI / a variable group, never in
#   this file). The deploy stage passes them as ENV to the deploy step, which
#   writes them into the persistent server .env via deployment-utils.sh's
#   save_env_var (never echoed, never logged). Azure auto-masks secret variables
#   in logs; we additionally never `echo` them.
# =============================================================================

trigger:
  branches:
    include:
      - main

pool: "Linux"

# Don't run this deploy pipeline on PRs — GitHub Actions ci.yml covers PR CI.
pr: none

variables:
  # The build tag every image and the deploy scripts agree on. BuildId is
  # monotonic and unique per run, so it's a safe, traceable image tag.
  deployTag: $(Build.BuildId)
  imageArtifactName: km-images
  # The PERSISTENT server config/secrets file. It must live OUTSIDE the pipeline
  # checkout (which is wiped every run) so ACTIVE_ENVIRONMENT, image tags, and the
  # refreshed secrets survive between deploys. deployment-utils.sh honors
  # KM_ENV_FILE (else it would default to the ephemeral ./Deploy/.env). Override
  # this variable in the Azure UI if the agent home differs from /home/patrick.
  KM_ENV_FILE: /home/patrick/Services/KoreanMaster/.env

stages:
  # ===========================================================================
  # Stage 1 — BuildAndTest  (Microsoft-hosted ubuntu agent)
  # ===========================================================================
  - stage: BuildAndTest
    displayName: Build and test
    jobs:
      - job: BuildJob
        displayName: Lint, typecheck, test, build images
        pool: 
          name: "Linux"
          demands:
            - Build -equals True
        steps:
          - checkout: self
            displayName: Checkout source
            

          - task: NodeTool@0
            displayName: Use Node 20
            inputs:
              versionSpec: "20.x"

          # --- Server lane (mirrors ci.yml server-checks) ---------------------
          # The route tests self-provision a throwaway Postgres via testcontainers
          # (auto-torn-down after the run) — the agent has Docker, so this is the
          # proper place to run them. The env vars below are PLACEHOLDERS that only
          # satisfy the import-time config validation (loadConfig runs when route
          # modules load, before any test body); testcontainers then overrides
          # DATABASE_URL with the real container at runtime. None are secrets.
          - script: |
              set -euo pipefail
              npm ci
              npm run lint
              npm run typecheck
              npm test
            workingDirectory: server
            displayName: "Server: ci + lint + typecheck + test"
            env:
              DATABASE_URL: "postgres://test:test@localhost:5432/test"
              KIWI_URL: "http://kiwi.invalid/"
              CLIENT_ORIGIN: "http://localhost:5173"
              TOTP_SECRET_ENC_KEY: "dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtMzI="
              PORT: "4000"

          # --- Client lane (mirrors ci.yml client-checks) ---------------------
          - script: |
              set -euo pipefail
              npm ci
              npm run lint
              npm run build
            workingDirectory: client
            displayName: "Client: ci + lint + build"

          # --- Build the three production images ------------------------------
          # Build context per image. The client uses Dockerfile.prod (static
          # nginx, VITE_API_URL UNSET -> same-origin). Tags are $(deployTag).
          # NOTE: client/Dockerfile.prod COPYs Deploy/client-nginx.conf, so the
          # client build context is the repo root (".") not the client lane.
          - task: Docker@2
            displayName: "Build km-server image"
            inputs:
              command: build
              repository: km-server
              Dockerfile: server/Dockerfile
              buildContext: server
              tags: $(deployTag)

          - task: Docker@2
            displayName: "Build km-client image (prod static nginx)"
            inputs:
              command: build
              repository: km-client
              Dockerfile: client/Dockerfile.prod
              buildContext: "."
              tags: $(deployTag)

          - task: Docker@2
            displayName: "Build km-kiwi image"
            inputs:
              command: build
              repository: km-kiwi
              Dockerfile: services/kiwi/Dockerfile
              buildContext: services/kiwi
              tags: $(deployTag)

          # --- Save each image to a tar (no registry) -------------------------
          - script: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              docker save -o "$(Build.ArtifactStagingDirectory)/km-server-$(deployTag).tar" "km-server:$(deployTag)"
              docker save -o "$(Build.ArtifactStagingDirectory)/km-client-$(deployTag).tar" "km-client:$(deployTag)"
              docker save -o "$(Build.ArtifactStagingDirectory)/km-kiwi-$(deployTag).tar"   "km-kiwi:$(deployTag)"
              ls -lh "$(Build.ArtifactStagingDirectory)"
            displayName: "Save images to tar artifacts"

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: $(imageArtifactName)
            displayName: "Publish image tar artifacts"

  # ===========================================================================
  # Stage 2 — DeployToInactive  (self-hosted agent on dad's server)
  # ===========================================================================
  # Loads the images, refreshes secrets into the server .env, deploys the
  # INACTIVE color, runs DB migrate (expand/contract) + a pre-deploy backup
  # (inside azure-deploy-inactive.sh), validates on the TEST port. No switch.
  # The Environment 'km-inactive' is intentionally UNGATED (auto-deploy).
  - stage: DeployToInactive
    displayName: Deploy to inactive color
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - deployment: DeployInactiveJob
        displayName: Deploy inactive
        environment: km-inactive
        pool:
          name: "Linux"
          demands:
            - Deploy -equals True
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: Checkout source

                - download: current
                  artifact: $(imageArtifactName)
                  displayName: "Download image tar artifacts"

                - script: |
                    set -euo pipefail
                    ART="$(Pipeline.Workspace)/$(imageArtifactName)"
                    docker load -i "$ART/km-server-$(deployTag).tar"
                    docker load -i "$ART/km-client-$(deployTag).tar"
                    docker load -i "$ART/km-kiwi-$(deployTag).tar"
                    # P-SF5: assert all three images actually loaded at the expected
                    # tag. A corrupt/partial tar otherwise surfaces much later as a
                    # confusing "image not found" at compose_color up — fail fast here.
                    for img in km-server km-client km-kiwi; do
                      if ! docker image inspect "$img:$(deployTag)" >/dev/null 2>&1; then
                        echo "ERROR: $img:$(deployTag) did not load from its tar artifact" >&2
                        exit 1
                      fi
                    done
                    docker images | grep -E 'km-(server|client|kiwi)'
                  displayName: "Load images from tar"

                # Ensure the PERSISTENT server .env exists (KM_ENV_FILE) before any
                # script sources it. The pipeline checkout is wiped each run, so the
                # first deploy seeds the file from Deploy/.env.example at the stable
                # KM_ENV_FILE path with non-secret defaults (ports, DB user/name,
                # ACTIVE_ENVIRONMENT, CLIENT_ORIGIN); the next step writes the three
                # real secrets. On later deploys the file already exists and is left
                # as-is (ACTIVE_ENVIRONMENT + image tags persist across runs).
                - script: |
                    set -euo pipefail
                    ENV_FILE="$(KM_ENV_FILE)"
                    if [[ -f "$ENV_FILE" ]]; then
                      echo "server .env already present at $ENV_FILE — leaving it as-is"
                      exit 0
                    fi
                    echo "seeding new server .env at $ENV_FILE from Deploy/.env.example"
                    mkdir -p "$(dirname "$ENV_FILE")"
                    cp Deploy/.env.example "$ENV_FILE"
                    chmod 600 "$ENV_FILE"
                    # Replace the example placeholders for the NON-secret values with
                    # working defaults for this single-host deploy. (The three real
                    # secrets are written by the next step from Azure secret vars.)
                    set_kv() { local k="$1" v="$2"; if grep -q "^$k=" "$ENV_FILE"; then
                        sed -i "s|^$k=.*|$k=$v|" "$ENV_FILE"; else printf '%s=%s\n' "$k" "$v" >> "$ENV_FILE"; fi; }
                    set_kv ACTIVE_ENVIRONMENT blue
                    set_kv POSTGRES_USER korean_master
                    set_kv POSTGRES_DB korean_master
                    set_kv POSTGRES_HOST_PORT 5432
                    set_kv CLIENT_ORIGIN "http://localhost:1840"
                    set_kv REGISTRATION_ENABLED false
                    set_kv MFA_REQUIRED true
                    set_kv LOG_LEVEL info
                    echo "seeded $ENV_FILE (non-secret defaults set; secrets next)"
                  displayName: "Ensure server .env exists (seed on first deploy)"
                  env:
                    KM_ENV_FILE: $(KM_ENV_FILE)

                # Write/refresh the runtime secrets into the persistent server
                # .env. save_env_var (deployment-utils.sh) is idempotent and
                # NEVER logs the value. The values arrive as ENV from secret
                # pipeline variables (auto-masked by Azure); we never echo them.
                - script: |
                    set -euo pipefail
                    # save_env_var writes to KM_ENV_FILE (the persistent path set as a
                    # pipeline variable + exported below), not the ephemeral checkout.
                    source Deploy/deployment-utils.sh
                    save_env_var POSTGRES_PASSWORD     "$POSTGRES_PASSWORD"
                    save_env_var ANTHROPIC_API_KEY     "$ANTHROPIC_API_KEY"
                    save_env_var TOTP_SECRET_ENC_KEY   "$TOTP_SECRET_ENC_KEY"
                  displayName: "Refresh runtime secrets in server .env"
                  env:
                    KM_ENV_FILE: $(KM_ENV_FILE)
                    POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
                    ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
                    TOTP_SECRET_ENC_KEY: $(TOTP_SECRET_ENC_KEY)

                - script: |
                    set -euo pipefail
                    Deploy/azure-deploy-inactive.sh "$(deployTag)"
                  displayName: "Deploy to inactive color (migrate + deploy + verify on :1841)"
                  env:
                    KM_ENV_FILE: $(KM_ENV_FILE)

                - script: |
                    set -euo pipefail
                    Deploy/cleanup.sh
                  displayName: "Cleanup old images/containers"

  # ===========================================================================
  # Stage 3 — SwitchToProduction  (self-hosted agent, MANUAL approval gate)
  # ===========================================================================
  # Flips the LB from the old color to the freshly-deployed inactive color.
  # The Environment 'km-production' MUST be configured in Azure DevOps with a
  # manual-approval check — that approval IS the human gate for production.
  - stage: SwitchToProduction
    displayName: Switch to production (manual approval)
    dependsOn:
      - BuildAndTest
      - DeployToInactive
    condition: succeeded()
    jobs:
      - deployment: SwitchProductionJob
        displayName: Switch production
        environment: km-production
        pool:
          name: "Linux"
          demands:
            - Deploy -equals True
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: Checkout source

                - script: |
                    set -euo pipefail
                    Deploy/azure-switch-production.sh "$(deployTag)"
                  displayName: "Switch LB to new color (verify :1840, auto-rollback on fail)"
                  env:
                    KM_ENV_FILE: $(KM_ENV_FILE)

                - script: |
                    set -euo pipefail
                    Deploy/cleanup.sh
                  displayName: "Cleanup old images/containers"
