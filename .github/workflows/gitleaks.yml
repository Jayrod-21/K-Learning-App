name: gitleaks
on:
  push:
  pull_request:
jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    # gitleaks-action calls the GitHub API to list a PR's commits on
    # pull_request events; without pull-requests:read the default GITHUB_TOKEN
    # gets 403 "Resource not accessible by integration". Least-privilege: read only.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
