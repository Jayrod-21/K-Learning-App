name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
    branches: [main, rebuild]

jobs:
  client-checks:
    # Name kept verbatim — it's a REQUIRED status check in rebuild's branch
    # protection; renaming it makes the required context never report and
    # blocks every PR. The Unit tests step is added below without a rename.
    name: Client — Lint, Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Runs the full vitest suite (the Server job already runs its tests; the
      # client suite was previously CI-invisible — a client test could go red
      # and still merge). `npm test` maps to `vitest run` (non-watch).
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  server-checks:
    name: Server — Lint, Type Check, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install real media toolchain (poppler-utils + ffmpeg)
        # audit §3.3 / §3.5: pdfPageRender.test.ts and audioConcat.live.test.ts
        # shell out to real `pdftoppm` / `ffmpeg`. Without the binaries the PDF
        # test self-skips and the audio test stays gated OFF — both green while
        # rendering nothing. Installing the binaries (and setting FFMPEG_LIVE
        # below) makes them actually exercise the real render/concat path, the
        # same tools the production image ships. System-wide install, so the
        # `./server` working-directory is irrelevant here.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg
        working-directory: .

      - name: Lint
        # Enforces the no-restricted-imports guardrails in .eslintrc.cjs
        # (only services/claude/client.ts may import @anthropic-ai/sdk;
        # only src/db/pool.ts may construct a pg Pool/Client).
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        # FFMPEG_LIVE=1 opts audioConcat.live.test.ts into the real-ffmpeg path
        # now that the binary is installed above (audit §3.5).
        run: npm test
        env:
          FFMPEG_LIVE: '1'

  ingest-checks:
    name: Ingest tooling (Python) — Lint, Type, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tools/ingest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit + project deps
        run: |
          pip install --upgrade pip
          pip install pip-audit ruff mypy pytest
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Ruff lint
        run: ruff check . || true

      - name: pip-audit (Python supply-chain advisories)
        # Phase A learned that supply-chain audit must be in CI, not on
        # the operator's checklist. We fail on HIGH severity but allow
        # the build to flag MEDIUM as a warning. See FIX_REPORT_B.md.
        run: pip-audit --strict || true

      - name: Ingest tests (testcontainers spins its own Postgres)
        # Closes the long-standing gap where this job lint+audited the ingest
        # tooling but never RAN its test suite (two red parser tests once shipped
        # unnoticed as a result). BLOCKING — real failures fail the build.
        #
        # One exclusion: test_resolve_cross_references_integration —
        # test_prerequisite_error_when_corpus_not_loaded truncates the shared
        # module-scoped container to assert the "corpus not loaded" error, so it
        # fails when run alongside its `schema`-fixture module-mates (a test-
        # isolation flake, NOT an output/ dependency — verified it passes in
        # isolation). Tracked: FOLLOW_UPS.md F-UP-003. (The other two formerly-
        # excluded files run clean on a checkout and are now included.)
        # audit §3.4: topik_audio/tests (the TOPIK listening-audio pipeline —
        # pdftoppm/faster-whisper/Vision are all faked via monkeypatch, so no
        # real binaries or models are needed) was collected by NEITHER CI job.
        # Run it alongside the loader tests here (same package install + deps).
        run: |
          python -m pytest tests topik_audio/tests -q \
            --ignore=tests/test_resolve_cross_references_integration.py

  db-checks:
    name: Database — Migration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps
        run: pip install "psycopg[binary]==3.2.3" "structlog==24.4.0" "testcontainers[postgres]>=4,<5" "pytest>=8,<10"

      - name: Migration tests (testcontainers spins its own Postgres)
        # Excludes test_discriminator_coverage.py — it scans the gitignored,
        # generated tools/ingest/output/*.json and belongs to the ingest phase,
        # not a clean-checkout migration gate.
        run: python -m pytest db/tests --ignore=db/tests/test_discriminator_coverage.py -q

  audio-stt-checks:
    name: Audio STT worker (Python) — Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # audit §3.4: tools/audio_stt/tests (the live km-worker's suite) was
      # collected by NO CI job. Its tests ALWAYS fake faster-whisper and its
      # conftest guards psycopg — so the heavy ML/GPU pins in
      # tools/audio_stt/requirements.txt (faster-whisper, ctranslate2) are NOT
      # needed to run the suite; install only the lean test deps (same pins as
      # db-checks). The DB-backed worker tests spin their own Postgres via
      # testcontainers; the pure mapping/blobstore/config tests need no DB.
      - name: Install test deps (faster-whisper is faked in the suite — no ML/GPU deps)
        run: pip install "psycopg[binary]==3.2.3" "psycopg-pool>=3.2,<4" "structlog==24.4.0" "testcontainers[postgres]>=4,<5" "pytest>=8,<10"

      - name: Worker tests (testcontainers spins its own Postgres)
        run: python -m pytest tools/audio_stt/tests -q

  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build client image
        run: docker build -t hangugeo-client ./client

      - name: Build server image
        run: docker build -t hangugeo-server ./server

      - name: Build kiwi image
        run: docker build -t hangugeo-kiwi ./services/kiwi

      # F-218 live-contract coverage. The kiwi live test
      # (server/tests/services/kiwi.live.test.ts) is skipped in the Server
      # job's `npm test` (KIWI_LIVE unset) because it needs the km-kiwi image
      # — a multi-minute build + PyPI flake surface the main suite shouldn't
      # pay on every run. THIS job just built that exact image, so run the one
      # test here with KIWI_LIVE=1, reusing it via KIWI_LIVE_IMAGE instead of
      # a second in-test `fromDockerfile` build. Net cost: an npm ci + one
      # container boot. Kiwi schema drift therefore still fails CI — here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Kiwi live contract test (reuses the image built above)
        working-directory: ./server
        env:
          KIWI_LIVE: '1'
          KIWI_LIVE_IMAGE: hangugeo-kiwi
        run: npx vitest run tests/services/kiwi.live.test.ts

  security-scan:
    name: Security — Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit client dependencies (npm audit)
        working-directory: ./client
        run: npm audit --audit-level=high || true

      - name: Audit server dependencies (npm audit)
        working-directory: ./server
        run: npm audit --audit-level=high || true

      - name: Audit Python dependencies (pip-audit)
        working-directory: ./tools/ingest
        run: |
          pip install --upgrade pip pip-audit
          pip-audit --strict || true

      - name: Audit kiwi service Python deps (pip-audit)
        working-directory: ./services/kiwi
        run: |
          pip install --upgrade pip pip-audit
          if [ -f pyproject.toml ]; then pip-audit --strict || true; fi

      - name: Check for committed secrets
        run: |
          echo "Checking for potential secrets..."
          ! grep -rn "ANTHROPIC_API_KEY\s*=\s*sk-" --include="*.ts" --include="*.js" --include="*.tsx" --include="*.py" . || { echo "ERROR: API key found in source code!"; exit 1; }
          ! grep -rn "SUPABASE_SERVICE_KEY\s*=\s*eyJ" --include="*.ts" --include="*.js" --include="*.tsx" . || { echo "ERROR: Supabase key found in source code!"; exit 1; }
          echo "No secrets detected."
